<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>リンステ専用 | トリプルHTML変換ツール</title>
    <!-- Use local Bootstrap 3 -->
    <link rel="stylesheet" href="../css/bootstrap.min.css">
    <!-- Custom styles -->
    <link rel="stylesheet" href="../style3.css">
    <link rel="stylesheet" href="css/convert.css">
</head>
<body>

<div class="app-wrapper">
    <header class="app-header">
        <div class="d-flex align-items-center">
            <a href="index.html" class="text-white mr-2" style="color: white; text-decoration: none;">
                <span class="glyphicon glyphicon-arrow-left" aria-hidden="true"></span>
            </a>
            <h1 class="app-title">
                <span class="glyphicon glyphicon-th-large" aria-hidden="true" style="margin-right: 8px; color: #64b5f6;"></span>
                リンステ・トリプルビュー
            </h1>
        </div>

        <div class="toolbar-options">
            <div class="option-item">
                <input type="checkbox" id="normalizeChars" checked>
                <label for="normalizeChars">文字正規化</label>
            </div>
            
            <div class="option-item ml-2" style="border-left: 1px solid rgba(255,255,255,0.3); padding-left: 1rem;">
                <input type="checkbox" id="darkModeToggle">
                <label for="darkModeToggle" title="ダークモード切替"><span class="glyphicon glyphicon-adjust" aria-hidden="true"></span></label>
            </div>
        </div>

        <div>
            <button id="clear-btn" class="btn btn-default btn-xs mr-1" style="background: transparent; color: white; border-color: white;">クリア</button>
        </div>
    </header>

    <main class="workspace">
        <!-- 1. Input -->
        <section class="pane">
            <div class="pane-header">
                <span><span class="glyphicon glyphicon-edit" aria-hidden="true"></span> 1. 入力 (原稿)</span>
                <span id="char-count" class="badge">0 chars</span>
            </div>
            <div class="pane-content">
                <div id="input-area" contenteditable="true"></div>
            </div>
        </section>

        <!-- 2. Preview -->
        <section class="pane">
            <div class="pane-header">
                <span><span class="glyphicon glyphicon-eye-open" aria-hidden="true"></span> 2. プレビュー (見た目)</span>
            </div>
            <div class="pane-content">
                <div id="preview-area"></div>
            </div>
        </section>

        <!-- 3. Source -->
        <section class="pane">
            <div class="pane-header">
                <span><span class="glyphicon glyphicon-list-alt" aria-hidden="true"></span> 3. HTMLソース (コード)</span>
            </div>
            <div class="pane-content">
                <textarea id="output-source" readonly></textarea>
            </div>
            <div class="pane-actions">
                <button id="copy-btn" class="btn btn-primary btn-sm btn-block"><span class="glyphicon glyphicon-copy" aria-hidden="true"></span> コードをコピー</button>
            </div>
        </section>
    </main>
</div>

<div id="toast">コピーしました！</div>

<script src="js/convert.js"></script>
</body>
</html>
