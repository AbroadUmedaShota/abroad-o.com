<!DOCTYPE html>
<html lang="ja">
<head>
    <!-- メタタグ設定 -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>社内ツールポータル │ アブロードアウトソーシング株式会社</title>
    
    <!-- CSSファイルの読み込み -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.1/css/all.min.css">
    <link rel="stylesheet" href="../style3.css">
    
    <style>
        .tool-card {
            transition: transform 0.3s, box-shadow 0.3s;
            height: 100%;
            border-radius: 10px;
            overflow: hidden;
            border: none;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .tool-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.15);
        }
        .tool-icon {
            font-size: 3rem;
            margin-bottom: 20px;
            color: #003366;
        }
        .card-body {
            padding: 30px;
            text-align: center;
        }
        .card-title {
            font-weight: bold;
            color: #333;
            margin-bottom: 15px;
        }
        .card-text {
            color: #666;
            font-size: 0.9rem;
            margin-bottom: 20px;
        }
        #portal-hero {
            background: linear-gradient(135deg, #003366 0%, #001a33 100%);
            color: white;
            padding: 60px 0;
            margin-bottom: 50px;
            text-align: center;
        }
        #portal-hero h1 {
            font-weight: bold;
            margin-bottom: 20px;
        }
        .btn-tool {
            background-color: #007bff;
            border: none;
            color: white;
            padding: 10px 25px;
            border-radius: 25px;
            font-weight: bold;
            transition: background 0.2s;
        }
        .btn-tool:hover {
            background-color: #0056b3;
            color: white;
        }
        footer {
            margin-top: 80px;
            padding: 40px 0;
            background-color: #f8f9fa;
            border-top: 1px solid #dee2e6;
            text-align: center;
            color: #666;
        }
    </style>
</head>
<body>
<header>
    <!-- ヘッダー上部 -->
    <section id="header_top">
        <div class="container">
            <div class="row">
                <div class="col-sm-6 col-md-6">
                    <a href="../index.html"><img src="../image/rogo.png" alt="アブロードアウトソーシング株式会社のロゴ"></a>
                </div>
            </div>
        </div>
    </section>
</header>

<main>
    <section id="portal-hero">
        <div class="container">
            <h1>Linste Production Tools</h1>
            <p>制作支援・業務効率化のための社内ツールポータル</p>
        </div>
    </section>

    <div class="container">
        <div class="row">
            <!-- HTML変換ツール（トリプルビュー） -->
            <div class="col-md-4 mb-4">
                <div class="card tool-card">
                    <div class="card-body">
                        <div class="tool-icon">
                            <i class="fas fa-file-code"></i>
                        </div>
                        <h5 class="card-title">トリプルHTML変換</h5>
                        <p class="card-text">入力・プレビュー・ソースの3画面で効率的にHTML変換を行います（リンステ専用）。</p>
                        <a href="convert.html" class="btn btn-tool">ツールを開く</a>
                    </div>
                </div>
            </div>

            <!-- ExcelテキストHTML変換ツール -->
            <div class="col-md-4 mb-4">
                <div class="card tool-card">
                    <div class="card-body">
                        <div class="tool-icon">
                            <i class="fas fa-file-excel"></i>
                        </div>
                        <h5 class="card-title">Excel HTML変換</h5>
                        <p class="card-text">ExcelやWordからコピーした文章のスタイルを維持したまま、簡単なHTMLタグへ変換します。</p>
                        <a href="excel_to_html.html" class="btn btn-tool">ツールを開く</a>
                    </div>
                </div>
            </div>

            <!-- ローカルフォルダ作成支援ツール -->
            <div class="col-md-4 mb-4">
                <div class="card tool-card">
                    <div class="card-body">
                        <div class="tool-icon">
                            <i class="fas fa-folder-plus"></i>
                        </div>
                        <h5 class="card-title">フォルダ作成支援</h5>
                        <p class="card-text">フォルダ名のリストから、コマンドプロンプト用の一括作成コマンドを生成します。</p>
                        <a href="mkfolder.html" class="btn btn-tool">ツールを開く</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

<footer>
    <div class="container">
        <p>&copy; Abroad Outsourcing Inc. All Rights Reserved.</p>
        <p class="small"><a href="../index.html">ホームページへ戻る</a></p>
    </div>
</footer>

<script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
