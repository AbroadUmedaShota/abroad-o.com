name: Deploy to Sakura

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Package, audit, preflight, or deploy to Sakura."
        required: true
        default: "package"
        type: choice
        options:
          - "package"
          - "audit"
          - "preflight"
          - "deploy"
      target_sha:
        description: "Exact current master commit SHA already passed trusted Site checks."
        required: false
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: sakura-deploy
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout trusted gate implementation from master
        if: ${{ inputs.mode == 'preflight' || inputs.mode == 'deploy' }}
        uses: actions/checkout@v7
        with:
          ref: master
      - name: Require current master and its successful trusted Site checks
        if: ${{ inputs.mode == 'preflight' || inputs.mode == 'deploy' }}
        run: node scripts/check-sakura-site-gate.mjs
        env:
          TARGET_SHA: ${{ inputs.target_sha }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REF: ${{ github.ref }}

  deploy:
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout selected master SHA
        uses: actions/checkout@v7
        with:
          ref: ${{ (inputs.mode == 'preflight' || inputs.mode == 'deploy') && inputs.target_sha || 'master' }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install site dependencies
        run: npm ci

      - name: Package only
        if: ${{ inputs.mode == 'package' }}
        shell: pwsh
        run: ./scripts/deploy-sakura.ps1 -Mode DryRun

      - name: Validate Sakura secrets
        if: ${{ inputs.mode == 'audit' || inputs.mode == 'preflight' || inputs.mode == 'deploy' }}
        shell: bash
        env:
          SAKURA_HOST: ${{ secrets.SAKURA_HOST }}
          SAKURA_USER: ${{ secrets.SAKURA_USER }}
          SAKURA_REMOTE_DIR: ${{ secrets.SAKURA_REMOTE_DIR }}
          SAKURA_SSH_KEY: ${{ secrets.SAKURA_SSH_KEY }}
          SAKURA_KNOWN_HOSTS: ${{ secrets.SAKURA_KNOWN_HOSTS }}
          SAKURA_PORT: ${{ secrets.SAKURA_PORT }}
        run: |
          set -euo pipefail
          missing=()
          for name in SAKURA_HOST SAKURA_USER SAKURA_REMOTE_DIR SAKURA_SSH_KEY SAKURA_KNOWN_HOSTS SAKURA_PORT; do
            if [[ -z "${!name}" ]]; then
              missing+=("$name")
            fi
          done
          if (( ${#missing[@]} > 0 )); then
            printf 'Missing required repository secrets: %s\n' "${missing[*]}" >&2
            exit 1
          fi

      - name: Install SSH key
        if: ${{ inputs.mode == 'audit' || inputs.mode == 'preflight' || inputs.mode == 'deploy' }}
        shell: bash
        env:
          SAKURA_HOST: ${{ secrets.SAKURA_HOST }}
          SAKURA_SSH_KEY: ${{ secrets.SAKURA_SSH_KEY }}
          SAKURA_KNOWN_HOSTS: ${{ secrets.SAKURA_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$SAKURA_SSH_KEY" > "$HOME/.ssh/sakura_deploy_key"
          printf '%s\n' "$SAKURA_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/sakura_deploy_key"
          ssh-keygen -y -f "$HOME/.ssh/sakura_deploy_key" > /dev/null
          ssh-keygen -F "$SAKURA_HOST" -f "$HOME/.ssh/known_hosts" > /dev/null

      - name: Audit Sakura public files
        if: ${{ inputs.mode == 'audit' }}
        shell: pwsh
        env:
          SAKURA_HOST: ${{ secrets.SAKURA_HOST }}
          SAKURA_USER: ${{ secrets.SAKURA_USER }}
          SAKURA_REMOTE_DIR: ${{ secrets.SAKURA_REMOTE_DIR }}
          SAKURA_PORT: ${{ secrets.SAKURA_PORT }}
        run: |
          $env:SAKURA_SSH_KEY_PATH = Join-Path $HOME ".ssh/sakura_deploy_key"
          ./scripts/deploy-sakura.ps1 -Mode Audit

      - name: Preflight Sakura deployment contract
        if: ${{ inputs.mode == 'preflight' }}
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SAKURA_SELECTED_SHA: ${{ inputs.target_sha }}
          SAKURA_HOST: ${{ secrets.SAKURA_HOST }}
          SAKURA_USER: ${{ secrets.SAKURA_USER }}
          SAKURA_REMOTE_DIR: ${{ secrets.SAKURA_REMOTE_DIR }}
          SAKURA_PORT: ${{ secrets.SAKURA_PORT }}
        run: |
          $env:SAKURA_SSH_KEY_PATH = Join-Path $HOME ".ssh/sakura_deploy_key"
          ./scripts/deploy-sakura.ps1 -Mode Preflight

      - name: Deploy to Sakura
        if: ${{ inputs.mode == 'deploy' }}
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SAKURA_SELECTED_SHA: ${{ inputs.target_sha }}
          SAKURA_HOST: ${{ secrets.SAKURA_HOST }}
          SAKURA_USER: ${{ secrets.SAKURA_USER }}
          SAKURA_REMOTE_DIR: ${{ secrets.SAKURA_REMOTE_DIR }}
          SAKURA_PORT: ${{ secrets.SAKURA_PORT }}
        run: |
          $env:SAKURA_SSH_KEY_PATH = Join-Path $HOME ".ssh/sakura_deploy_key"
          ./scripts/deploy-sakura.ps1 -Mode Deploy
