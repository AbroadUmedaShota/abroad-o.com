name: Deploy to Sakura

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Package, audit, preflight, or deploy to Sakura."
        required: true
        default: "package"
        type: choice
        options:
          - "package"
          - "audit"
          - "preflight"
          - "deploy"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install site dependencies
        run: npm ci

      - name: Package only
        if: ${{ inputs.mode == 'package' }}
        shell: pwsh
        run: ./scripts/deploy-sakura.ps1 -Mode DryRun

      - name: Validate Sakura secrets
        if: ${{ inputs.mode == 'audit' || inputs.mode == 'preflight' || inputs.mode == 'deploy' }}
        shell: bash
        env:
          SAKURA_HOST: ${{ secrets.SAKURA_HOST }}
          SAKURA_USER: ${{ secrets.SAKURA_USER }}
          SAKURA_REMOTE_DIR: ${{ secrets.SAKURA_REMOTE_DIR }}
          SAKURA_SSH_KEY: ${{ secrets.SAKURA_SSH_KEY }}
          SAKURA_KNOWN_HOSTS: ${{ secrets.SAKURA_KNOWN_HOSTS }}
          SAKURA_PORT: ${{ secrets.SAKURA_PORT }}
        run: |
          set -euo pipefail
          missing=()
          for name in SAKURA_HOST SAKURA_USER SAKURA_REMOTE_DIR SAKURA_SSH_KEY SAKURA_KNOWN_HOSTS SAKURA_PORT; do
            if [[ -z "${!name}" ]]; then
              missing+=("$name")
            fi
          done
          if (( ${#missing[@]} > 0 )); then
            printf 'Missing required repository secrets: %s\n' "${missing[*]}" >&2
            exit 1
          fi

      - name: Install SSH key
        if: ${{ inputs.mode == 'audit' || inputs.mode == 'preflight' || inputs.mode == 'deploy' }}
        shell: bash
        env:
          SAKURA_HOST: ${{ secrets.SAKURA_HOST }}
          SAKURA_SSH_KEY: ${{ secrets.SAKURA_SSH_KEY }}
          SAKURA_KNOWN_HOSTS: ${{ secrets.SAKURA_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$SAKURA_SSH_KEY" > "$HOME/.ssh/sakura_deploy_key"
          printf '%s\n' "$SAKURA_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/sakura_deploy_key"
          ssh-keygen -y -f "$HOME/.ssh/sakura_deploy_key" > /dev/null
          ssh-keygen -F "$SAKURA_HOST" -f "$HOME/.ssh/known_hosts" > /dev/null

      - name: Audit Sakura public files
        if: ${{ inputs.mode == 'audit' }}
        shell: pwsh
        env:
          SAKURA_HOST: ${{ secrets.SAKURA_HOST }}
          SAKURA_USER: ${{ secrets.SAKURA_USER }}
          SAKURA_REMOTE_DIR: ${{ secrets.SAKURA_REMOTE_DIR }}
          SAKURA_PORT: ${{ secrets.SAKURA_PORT }}
        run: |
          $env:SAKURA_SSH_KEY_PATH = Join-Path $HOME ".ssh/sakura_deploy_key"
          ./scripts/deploy-sakura.ps1 -Mode Audit

      - name: Preflight Sakura deployment contract
        if: ${{ inputs.mode == 'preflight' }}
        shell: pwsh
        env:
          SAKURA_HOST: ${{ secrets.SAKURA_HOST }}
          SAKURA_USER: ${{ secrets.SAKURA_USER }}
          SAKURA_REMOTE_DIR: ${{ secrets.SAKURA_REMOTE_DIR }}
          SAKURA_PORT: ${{ secrets.SAKURA_PORT }}
        run: |
          $env:SAKURA_SSH_KEY_PATH = Join-Path $HOME ".ssh/sakura_deploy_key"
          ./scripts/deploy-sakura.ps1 -Mode Preflight

      - name: Deploy to Sakura
        if: ${{ inputs.mode == 'deploy' }}
        shell: pwsh
        env:
          SAKURA_HOST: ${{ secrets.SAKURA_HOST }}
          SAKURA_USER: ${{ secrets.SAKURA_USER }}
          SAKURA_REMOTE_DIR: ${{ secrets.SAKURA_REMOTE_DIR }}
          SAKURA_PORT: ${{ secrets.SAKURA_PORT }}
        run: |
          $env:SAKURA_SSH_KEY_PATH = Join-Path $HOME ".ssh/sakura_deploy_key"
          ./scripts/deploy-sakura.ps1 -Mode Deploy
