name: Site checks

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  site-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check:site
      - run: npm run check:a11y
      - name: Install and test Apache redirects
        run: |
          sudo apt-get update
          sudo apt-get install -y apache2 openssl
          npm run build:site
          openssl req -x509 -nodes -newkey rsa:2048 -keyout /tmp/abroad.key -out /tmp/abroad.crt -subj "/CN=localhost" -days 1
          apache2 -t -f "$GITHUB_WORKSPACE/scripts/apache-test/httpd.conf" -D DOCROOT="$GITHUB_WORKSPACE/_site" -D CERT=/tmp/abroad.crt -D KEY=/tmp/abroad.key
          sudo apache2 -f "$GITHUB_WORKSPACE/scripts/apache-test/httpd.conf" -D DOCROOT="$GITHUB_WORKSPACE/_site" -D CERT=/tmp/abroad.crt -D KEY=/tmp/abroad.key -k start
          NODE_TLS_REJECT_UNAUTHORIZED=0 npm run check:redirects
        if: always()
      - name: Stop Apache test server
        if: always()
        run: sudo apache2 -f "$GITHUB_WORKSPACE/scripts/apache-test/httpd.conf" -k stop || true
