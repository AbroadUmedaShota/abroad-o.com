name: Site checks

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  site-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check:site
      - run: npm run check:restore-contract
      - run: npm run check:ie-shims
      - run: npm run check:csp-report-only
      - run: npm run check:csp-report-only-browser
      - run: npm run check:slick-largeformat
      - run: npm run check:local-fonts
      - run: npm run check:csp-readiness
      - run: npm run check:csp-runtime
      - run: npm run check:page-style-ui
      - run: npm run check:inline-style-ui
      - run: npm run check:image-performance
      - run: npm run inventory:public-assets
      - name: Upload public asset inventory
        uses: actions/upload-artifact@v4
        with:
          name: public-asset-inventory
          path: output/public-asset-inventory.json
      - run: npm run check:a11y
      - run: npm run check:modern-ui
      - run: npm run check:legacy-ui
      - run: npm run check:news-form-ui
      - run: npm run check:pr4
      - name: Install and test Apache redirects
        run: |
          sudo apt-get update
          sudo apt-get install -y apache2 openssl
          npm run build:site
          sudo rm -rf /tmp/abroad-site
          sudo install -d -m 755 /tmp/abroad-site
          sudo cp -a _site/. /tmp/abroad-site/
          sudo chmod -R a+rX /tmp/abroad-site
          openssl req -x509 -nodes -newkey rsa:2048 -keyout /tmp/abroad.key -out /tmp/abroad.crt -subj "/CN=localhost" -days 1
          export DOCROOT=/tmp/abroad-site CERT=/tmp/abroad.crt KEY=/tmp/abroad.key
          apache2 -t -f "$GITHUB_WORKSPACE/scripts/apache-test/httpd.conf"
          sudo --preserve-env=DOCROOT,CERT,KEY apache2 -f "$GITHUB_WORKSPACE/scripts/apache-test/httpd.conf" -k start
          NODE_TLS_REJECT_UNAUTHORIZED=0 npm run check:redirects
      - name: Stop Apache test server
        if: always()
        run: DOCROOT=/tmp/abroad-site CERT=/tmp/abroad.crt KEY=/tmp/abroad.key sudo --preserve-env=DOCROOT,CERT,KEY apache2 -f "$GITHUB_WORKSPACE/scripts/apache-test/httpd.conf" -k stop || true
      - name: Show Apache test log on failure
        if: failure()
        run: sudo cat /tmp/abroad-apache-error.log || true

  contact-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: contact-worker
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: contact-worker/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run check

  site-gate:
    # This is the stable terminal check for branch protection. It must run even
    # when an upstream job fails, and fails unless every required job succeeded.
    if: ${{ always() }}
    needs: [site-check, contact-worker]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require all Site checks jobs to succeed
        env:
          SITE_CHECK_RESULT: ${{ needs.site-check.result }}
          CONTACT_WORKER_RESULT: ${{ needs.contact-worker.result }}
        run: |
          test "$SITE_CHECK_RESULT" = success
          test "$CONTACT_WORKER_RESULT" = success
